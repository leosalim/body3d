<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>body3d · iframe host</title>
  <link rel="icon" href="data:," />
  <style>body { margin: 0; font: 13px system-ui; } iframe { width: 100%; height: 90vh; border: 0; } #log { padding: 6px 8px; }</style>
</head>
<body>
  <!-- host page: drives embed.html through postMessage only -->
  <iframe id="f" src="/embed.html?model=male&view=back&credit=0&bg=%23e9ecea"></iframe>
  <div id="log">—</div>
  <script>
    const f = document.getElementById('f')
    window.messages = []
    addEventListener('message', (e) => {
      if (e.source !== f.contentWindow) return
      window.messages.push(e.data.type)
      document.getElementById('log').textContent = JSON.stringify(e.data)
      if (e.data.type === 'body3d:ready' && !window.sent) {
        window.sent = true
        f.contentWindow.postMessage({ type: 'body3d:set', view: 'back',
          activations: [{ muscle: 'Lats', activation: 100 }, { muscle: 'Biceps', activation: 55 }] }, '*')
        setTimeout(() => { window.ready = true }, 900)
      }
    })
  </script>
</body>
</html>
