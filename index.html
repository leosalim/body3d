<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>body3d · 3D muscles</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="./src/demo.css" />
</head>
<body>
  <main class="layout">
    <section class="stage">
      <div id="viewer" class="viewer"></div>
      <div class="stage-bar">
        <div class="seg" id="sex">
          <button data-v="male" data-t="male" class="on">Male</button>
          <button data-v="female" data-t="female">Female</button>
        </div>
        <div class="seg" id="views">
          <button data-v="front" data-t="front">Front</button>
          <button data-v="back" data-t="back">Back</button>
          <button data-v="left" data-t="left">Left</button>
          <button data-v="right" data-t="right">Right</button>
        </div>
        <div class="seg" id="lang">
          <button data-v="en">EN</button>
          <button data-v="pt-BR">PT</button>
        </div>
      </div>
      <div class="stage-info" id="info" aria-live="polite"></div>
    </section>

    <aside class="panel">
      <header>
        <h1 data-t="title">3D muscles</h1>
        <p class="sub" data-t="sub"></p>
      </header>

      <h2 data-t="poses">Poses</h2>
      <div class="presets" id="poses"></div>

      <h2 data-t="exercises">Exercises</h2>
      <div class="presets" id="presets"></div>

      <h2 data-t="groups">Training groups</h2>
      <div class="groups" id="groups"></div>

      <h2 data-t="body">Body</h2>
      <label class="row" for="ffmi">
        <span data-t="ffmi">Normalized FFMI</span>
        <input id="ffmi" type="range" min="15" max="32" step="0.5" value="26" />
        <output id="ffmi-out">26</output>
      </label>

      <h2 data-t="display">Display</h2>
      <label class="check"><input type="checkbox" id="bones" checked /> <span data-t="bones">Skeleton</span></label>
      <label class="check"><input type="checkbox" id="focus" /> <span data-t="focus">Dim what is not active</span></label>
      <label class="check"><input type="checkbox" id="rotate" /> <span data-t="rotate">Auto-rotate</span></label>

      <h2 data-t="input">Input sent to the viewer</h2>
      <pre id="json" class="json"></pre>
      <button class="link" id="clear" data-t="clear">Clear activations</button>
    </aside>
  </main>
  <script type="module" src="./src/demo.js"></script>
</body>
</html>
