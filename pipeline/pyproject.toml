[project]
name = "body3d-pipeline"
version = "0.2.0"
description = "Builds the body3d GLB models from BodyParts3D: selection, synthesis, rig, hypertrophy morphs and tape-fit data."
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "fast-simplification>=0.1.7",
]

[project.optional-dependencies]
dev = ["ruff>=0.6"]

# The modules are scripts run from this directory (python build.py); nothing is packaged.
[tool.setuptools]
py-modules = []

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = [
    "E741",    # short math names (l, I) are kept where they follow the formulas
    "RUF001",  # ×, –, − and µ in strings are intended
    "RUF002",
    "RUF003",
    "SIM108",  # ternaries are not always clearer
    "B905",    # zip(strict=...) adds noise to numeric loops of equal-length arrays
]

[tool.ruff.lint.isort]
known-first-party = ["anatomy", "body", "bp3d", "build", "catalog", "catalog_doc", "catalog_js", "check_fit",
                     "debug_export", "export", "fitdata", "gltf", "meshops", "morph", "rig", "split", "synth", "voxel"]

[tool.ruff.lint.per-file-ignores]
"anatomy.py" = ["E501"]  # one row per muscle reads better than wrapped rows
